<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta de Ahorro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7ff;
      padding: 24px 16px;
      color: #1a1a2e;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .goal-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .progress-bar {
      height: 10px; background: #f0f0f0; border-radius: 5px; margin: 12px 0;
    }
    .progress-fill {
      height: 10px; background: #3b82f6; border-radius: 5px;
      transition: width 0.4s ease;
    }
    .amounts { display: flex; justify-content: space-between; font-size: 14px; }
    .accumulated { font-weight: 700; font-size: 18px; }
    .target { color: #888; }
    .percentage { color: #3b82f6; font-weight: 700; font-size: 18px; }
    .completed-badge {
      background: #d1fae5; color: #065f46; border-radius: 6px;
      padding: 4px 10px; font-size: 13px; font-weight: 600;
      display: inline-block; margin-top: 8px;
    }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    input[type=number] {
      width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 16px; outline: none;
    }
    input[type=number]:focus { border-color: #3b82f6; }
    .error { color: #ef4444; font-size: 13px; margin-top: 6px; min-height: 18px; }
    button {
      width: 100%; padding: 14px; background: #3b82f6; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 16px;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .success-msg {
      text-align: center; color: #065f46; font-weight: 600;
      margin-top: 12px; min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="goal-name" id="goalName">Cargando...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="amounts">
      <span class="accumulated" id="accumulated">$0</span>
      <span class="target" id="target">/ $0</span>
      <span class="percentage" id="percentage">0%</span>
    </div>
    <div id="completedBadge" class="completed-badge" style="display:none">&#10003; Meta completada</div>
  </div>

  <div class="card">
    <label for="depositAmount">Monto a abonar (COP)</label>
    <input
      type="number"
      id="depositAmount"
      placeholder="Ej: 50000"
      min="1"
      step="1000"
    />
    <div class="error" id="inputError"></div>
    <button id="depositBtn" disabled>Abonar</button>
    <div class="success-msg" id="successMsg"></div>
  </div>

  <script>
    var currentGoalId = null;

    function formatCOP(value) {
      return '$' + Number(value).toLocaleString('es-CO');
    }

    function updateUI(data) {
      document.getElementById('goalName').textContent = data.goalName || data.goalId || '';
      document.getElementById('progressFill').style.width = (data.progressPercentage || 0) + '%';
      document.getElementById('accumulated').textContent = formatCOP(data.accumulatedAmount || 0);
      document.getElementById('target').textContent = '/ ' + formatCOP(data.targetAmount || 0);
      document.getElementById('percentage').textContent = (data.progressPercentage || 0) + '%';
      var badge = document.getElementById('completedBadge');
      badge.style.display = data.isCompleted ? 'inline-block' : 'none';
      document.getElementById('depositBtn').disabled = !!data.isCompleted;
    }

    function handleNativeMessage(event) {
      try {
        var msg = JSON.parse(event.data);
        if (msg.type === 'SESSION_INIT') {
          var p = msg.payload;
          currentGoalId = p.goalId;
          updateUI({
            goalId: p.goalId,
            goalName: p.goalName,
            accumulatedAmount: p.accumulatedAmount,
            targetAmount: p.targetAmount,
            progressPercentage: p.progressPercentage,
            isCompleted: p.isCompleted,
          });
        }
        if (msg.type === 'GOAL_UPDATED') {
          updateUI(msg.payload);
        }
      } catch (e) {}
    }

    document.addEventListener('message', handleNativeMessage);
    window.addEventListener('message', handleNativeMessage);

    var depositInput = document.getElementById('depositAmount');
    var depositBtn = document.getElementById('depositBtn');
    var errorEl = document.getElementById('inputError');
    var successEl = document.getElementById('successMsg');

    depositInput.addEventListener('input', function () {
      errorEl.textContent = '';
      successEl.textContent = '';
    });

    depositBtn.addEventListener('click', function () {
      errorEl.textContent = '';
      successEl.textContent = '';
      var raw = depositInput.value.trim();
      var amount = parseFloat(raw);

      if (!raw || isNaN(amount) || amount <= 0) {
        errorEl.textContent = 'Ingresa un monto válido mayor a 0.';
        return;
      }
      if (!currentGoalId) {
        errorEl.textContent = 'No se ha cargado la meta. Intenta de nuevo.';
        return;
      }

      var message = JSON.stringify({
        type: 'DEPOSIT_CONFIRMED',
        payload: { goalId: currentGoalId, amount: amount },
      });

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(message);
      } else {
        window.postMessage(message, '*');
      }

      depositInput.value = '';
      successEl.textContent = '¡Abono enviado! Procesando...';
      depositBtn.disabled = true;
      setTimeout(function () { depositBtn.disabled = false; }, 1500);
    });

    // Signal readiness to React Native after DOM is ready
    setTimeout(function () {
      var readyMsg = JSON.stringify({ type: 'WEB_READY' });
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(readyMsg);
      }
    }, 100);
  </script>
</body>
</html>
